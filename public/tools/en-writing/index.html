<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>英文写作教练 · 希希的工具箱</title>
<style>
  :root {
    --bg: #e9efe6; --ink: #2d3b31; --accent: #3f7d5c; --line: #cfdad0;
    --card: #f8fbf5; --muted: #6b7a6d; --ok: #2f8f5b; --bad: #b0483a;
    --chip: #e3ecdf; --fix-bg: #f2f8ee;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1f2621; --ink: #dce5da; --accent: #7cbf98; --line: #3a453b;
      --card: #272f28; --muted: #93a295; --ok: #79c496; --bad: #e08a7a;
      --chip: #2c3831; --fix-bg: #2b362e;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.7 -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-text-size-adjust: 100%; }
  .wrap { width: min(660px, calc(100% - 28px)); margin: 0 auto; padding: 28px 0 72px; }
  header { display: flex; align-items: baseline; gap: 12px; margin-bottom: 22px; }
  header h1 { font-size: 20px; margin: 0; font-weight: 650; letter-spacing: .5px; }
  header a { margin-left: auto; font-size: 14px; color: var(--accent); text-decoration: none; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px; margin-bottom: 14px; }
  .topic-en { font-size: 21px; font-weight: 650; line-height: 1.45; margin: 6px 0 2px; }
  .topic-zh { color: var(--muted); font-size: 14px; }
  .topic-hint { color: var(--muted); font-size: 13px; margin-top: 6px; }
  .chip { display: inline-block; background: var(--chip); border-radius: 999px; padding: 2px 10px; font-size: 12px; color: var(--ink); }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-top: 12px; }
  .grow { flex: 1 1 auto; }
  button { font: inherit; border-radius: 10px; border: 1px solid var(--line); background: var(--card);
    color: var(--ink); padding: 9px 16px; cursor: pointer; }
  button:hover:not(:disabled) { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  button.mini { padding: 3px 10px; font-size: 13px; border-radius: 8px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  textarea { width: 100%; min-height: 220px; border: 1px solid var(--line); border-radius: 12px; background: var(--card);
    padding: 14px; font: 16px/1.75 inherit; color: var(--ink); resize: vertical; }
  textarea:focus { outline: 2px solid rgba(63,125,92,.35); border-color: var(--accent); }
  .count { text-align: right; color: var(--muted); font-size: 13px; margin-top: 6px; }
  .status { font-size: 14px; color: var(--muted); min-height: 20px; }
  .status.err { color: var(--bad); }
  .hidden { display: none; }
  h2 { font-size: 15px; margin: 0 0 10px; color: var(--ink); font-weight: 650; }
  .t-row { margin-bottom: 10px; }
  .t-row b { font-weight: 650; }
  .t-ex { color: var(--muted); font-size: 14px; margin-top: 2px; }
  .mv { padding: 7px 10px; border-left: 3px solid var(--accent); background: var(--fix-bg); border-radius: 8px; margin-bottom: 7px; }
  .mv .en { font-size: 15px; }
  .mv .zh { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .ph { display: inline-block; background: var(--chip); border-radius: 999px; padding: 4px 12px; margin: 0 6px 6px 0; font-size: 14px; }
  .ph span { color: var(--muted); font-size: 12px; margin-left: 5px; }
  details { border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; margin-top: 10px; }
  summary { cursor: pointer; font-size: 14px; color: var(--accent); }
  .err-item { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; background: var(--fix-bg); }
  .err-item .q { color: var(--bad); text-decoration: line-through; margin-right: 8px; }
  .err-item .f { font-weight: 650; }
  .err-item .w { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .err-item .k { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; margin-left: 6px; vertical-align: 2px; }
  .ask-box { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
  .ask-box .qrow { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 6px; }
  .ask-box input { flex: 1 1 180px; font: inherit; font-size: 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--ink); padding: 6px 10px; }
  .ask-a { font-size: 14px; margin-top: 6px; }
  .ask-a .eg { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .ask-adj { display: inline-block; font-size: 12px; color: #fff; background: var(--ok); border-radius: 6px; padding: 1px 8px; margin-bottom: 4px; }
  .hl { font-size: 14px; margin: 4px 0; }
  .comment { font-size: 14px; background: var(--chip); border-radius: 10px; padding: 10px 12px; margin-top: 10px; }
  pre.rewrite { white-space: pre-wrap; word-break: break-word; font: 15px/1.7 inherit; margin: 8px 0 0; }
  .wk { padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px; }
  .wk b { font-weight: 650; }
  .wk .ev { color: var(--muted); font-size: 13px; margin-top: 3px; }
  .wk .how { font-size: 14px; margin-top: 3px; }
  .step { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; background: var(--fix-bg); }
  .step .tag { display: inline-block; font-size: 11px; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 1px 8px; margin-bottom: 6px; }
  .step h3 { margin: 0 0 4px; font-size: 15px; }
  .step .ex { font-size: 14px; margin-top: 6px; }
  .step .ex .no { color: var(--bad); text-decoration: line-through; margin-right: 8px; }
  .step .drill { font-size: 14px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
  .focus { font-size: 14px; background: var(--chip); border-radius: 10px; padding: 10px 12px; margin-top: 10px; }
  footer { color: var(--muted); font-size: 12px; line-height: 1.7; margin-top: 8px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>✍️ 英文写作教练</h1>
    <a href="/">← 工具箱</a>
  </header>

  <section class="card" id="topic-card">
    <span class="chip" id="t-type">叙述</span>
    <div class="topic-en" id="t-en">…</div>
    <div class="topic-zh" id="t-zh"></div>
    <div class="topic-hint" id="t-hint"></div>
    <div class="row">
      <button id="dice">🎲 换一个主题</button>
      <span class="grow"></span>
      <span class="status" id="t-status"></span>
    </div>
  </section>

  <section class="card">
    <textarea id="essay" spellcheck="false" placeholder="Write here — 就围绕这个主题，把一件事说完整。
不用长，5~10 句话也算数；写完点下面「批改」。"></textarea>
    <div class="count" id="counter">0 words · 草稿自动存在本浏览器</div>
    <div class="row">
      <button id="tips-btn">🧠 表达帮助</button>
      <button class="primary" id="fix-btn">✍️ 批改这篇</button>
      <button id="pro-btn">🧭 学习画像</button>
    </div>
    <div class="status" id="status"></div>
  </section>

  <section class="card hidden" id="tips-card">
    <h2>这个主题常用的表达</h2>
    <div id="tips-body"></div>
  </section>

  <section class="card hidden" id="pro-card">
    <h2>学习画像 <span style="font-weight:400;color:var(--muted);font-size:13px">按你攒的批改台账诊断</span></h2>
    <div id="pro-body"></div>
    <div class="row">
      <button class="mini" id="pro-copy">复制画像</button>
      <span class="grow"></span>
      <button class="mini" id="pro-clear">清空台账</button>
    </div>
  </section>

  <section class="card hidden" id="fb-card">
    <h2 id="fb-title">批改结果</h2>
    <div id="fb-errors"></div>
    <div id="fb-highlights"></div>
    <div class="comment hidden" id="fb-comment"></div>
    <details id="fb-rewrite-box" hidden>
      <summary>🌿 润色后的全文</summary>
      <pre class="rewrite" id="fb-rewrite"></pre>
    </details>
    <div class="row">
      <button class="mini" id="fb-copy">复制批改</button>
      <button class="mini" id="fb-copyrw">复制润色全文</button>
      <span class="grow"></span>
      <span class="status" id="fb-status"></span>
    </div>
  </section>

  <footer>
    写作内容会发到<b>你自己的站点服务</b>（<code>/api/en-writing</code>）由服务器调模型批改，密钥只在服务端，浏览器看不到；
    <b>别把公司运单、结算这类机密写进作文里</b>。主题随机和词数统计都在这台设备上完成。
  </footer>
</div>

<script>
(function () {
'use strict';
  var API = '/api/en-writing';
  var LS = 'xixi.en-writing.draft.v1';
  var LSL = 'xixi.en-writing.log.v1';   // 批改台账：跨篇诊断的原料，只在本机
  var LSP = 'xixi.en-writing.profile.v1'; // 最近一次画像，点开不重新花钱
  var LSA = 'xixi.en-writing.ask.v1';   // 追问问答缓存：同一问题不重复花钱
  var state = { topic: null, tips: null, feedback: null, profile: null, busy: false, lastAction: null, askBusy: false };

  function el(id) { return document.getElementById(id); }
  function mk(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  /* ---------- 草稿 ---------- */
  function saveDraft() {
    try {
      localStorage.setItem(LS, JSON.stringify({
        topic: state.topic, text: el('essay').value, at: Date.now(),
      }));
    } catch (e) { /* 隐私模式存不下就算了 */ }
  }
  function loadDraft() {
    try { return JSON.parse(localStorage.getItem(LS) || 'null'); } catch (e) { return null; }
  }

  /* ---------- 请求 ---------- */
  async function callApi(payload) {
    var res;
    try {
      res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
    } catch (e) {
      if (location.protocol === 'file:') throw new Error('本地双击打开时无法生成（要连站点的服务）');
      throw new Error('连不上服务：' + e.message);
    }
    var json = null;
    try { json = await res.json(); } catch (e) { json = null; }
    if (json && json.ok) return json.data;
    if (res.status === 404 || res.status === 405 || res.status === 501) {
      throw new Error('写作接口没生效（HTTP ' + res.status + '），服务可能刚更新没重启。等十几秒点重试。');
    }
    throw new Error((json && json.error) || ('服务返回异常（HTTP ' + res.status + '）'));
  }

  function setStatus(msg, isErr) {
    var st = el('status');
    st.className = 'status' + (isErr ? ' err' : '');
    st.textContent = msg || '';
    if (isErr && state.lastAction) {
      var b = mk('button', 'mini', '重试');
      b.style.marginLeft = '8px';
      b.addEventListener('click', function () { state.lastAction(); });
      st.appendChild(b);
    }
  }

  /* ---------- 主题 ---------- */
  function renderTopic(t) {
    state.topic = t;
    el('t-type').textContent = t.type || '写作';
    el('t-en').textContent = t.en;
    el('t-zh').textContent = t.zh || '';
    el('t-hint').textContent = t.hint ? '可以往这几个方向写：' + t.hint : '';
    el('tips-card').classList.add('hidden');
    el('fb-card').classList.add('hidden');
    state.tips = null; state.feedback = null;
    saveDraft();
  }
  async function newTopic() {
    setStatus('');
    state.lastAction = newTopic;
    try {
      var t = await callApi({ mode: 'topic', avoid: state.topic && state.topic.en });
      renderTopic(t);
      state.lastAction = null;
    } catch (e) {
      setStatus(e.message, true);
    }
  }

  /* ---------- 词数 ---------- */
  function wordCount(text) { return (String(text).match(/[A-Za-z0-9'-]+/g) || []).length; }
  function updateCount() {
    el('counter').textContent = wordCount(el('essay').value) + ' words · 草稿自动存在本浏览器';
  }

  /* ---------- 表达帮助 ---------- */
  function renderTips(d) {
    state.tips = d;
    var body = el('tips-body');
    body.innerHTML = '';
    if ((d.tenses || []).length) {
      var tw = mk('div');
      tw.appendChild(mk('h2', null, '⏳ 时态怎么搭'));
      d.tenses.forEach(function (t) {
        var row = mk('div', 't-row');
        row.appendChild(mk('b', null, t.name));
        if (t.why) row.appendChild(document.createTextNode(' — ' + t.why));
        if (t.example) row.appendChild(mk('div', 't-ex', t.example));
        tw.appendChild(row);
      });
      body.appendChild(tw);
    }
    if ((d.moves || []).length) {
      var mw = mk('div');
      mw.appendChild(mk('h2', null, '🧱 可直接套的句式'));
      d.moves.forEach(function (m) {
        var box = mk('div', 'mv');
        box.appendChild(mk('div', 'en', m.en));
        if (m.zh) box.appendChild(mk('div', 'zh', m.zh));
        mw.appendChild(box);
      });
      body.appendChild(mw);
    }
    if ((d.phrases || []).length) {
      var pw = mk('div');
      pw.appendChild(mk('h2', null, '🔤 这个主题的高频搭配'));
      var wrap = mk('div');
      d.phrases.forEach(function (p) {
        var chip = mk('span', 'ph', p.en);
        if (p.zh) chip.appendChild(mk('span', null, p.zh));
        wrap.appendChild(chip);
      });
      pw.appendChild(wrap);
      body.appendChild(pw);
    }
    if (d.sample && d.sample.en) {
      var det = mk('details');
      det.appendChild(mk('summary', null, '📖 参考范文（45~70 词，别抄，找节奏）'));
      det.appendChild(mk('pre', 'rewrite', d.sample.en));
      if (d.sample.zh) {
        var z = mk('pre', 'rewrite', d.sample.zh);
        z.style.color = 'var(--muted)';
        det.appendChild(z);
      }
      body.appendChild(det);
    }
    el('tips-card').classList.remove('hidden');
  }
  async function getTips() {
    if (!state.topic) { setStatus('主题还没出来，稍一下下'); return; }
    setStatus('正在按主题整理表达（10~25 秒）…');
    state.lastAction = getTips;
    try {
      var d = await callApi({ mode: 'tips', topic: state.topic.en, topicZh: state.topic.zh, type: state.topic.type });
      renderTips(d);
      setStatus('');
      state.lastAction = null;
    } catch (e) {
      setStatus(e.message, true);
    }
  }

  /* ---------- 批改 ---------- */
  function renderFeedback(d) {
    state.feedback = d;
    var errs = el('fb-errors');
    errs.innerHTML = '';
    if (!(d.errors || []).length) {
      errs.appendChild(mk('p', 'count', '没挑出硬伤 🎉 看看润色版和点评就行。'));
    }
    (d.errors || []).forEach(function (x) {
      var item = mk('div', 'err-item');
      var line = mk('div');
      line.appendChild(mk('span', 'q', x.quote));
      line.appendChild(document.createTextNode(' → '));
      line.appendChild(mk('b', 'f', x.fix));
      if (x.kind) line.appendChild(mk('span', 'k', x.kind));
      item.appendChild(line);
      if (x.why) item.appendChild(mk('div', 'w', x.why));
      var qbtn = mk('button', 'mini', '❓ 这条为什么？');
      qbtn.style.marginTop = '8px';
      var box = mk('div', 'ask-box'); box.style.display = 'none';
      var qrow = mk('div', 'qrow');
      ['没看懂，再讲讲', '我觉得原句可以这么写'].forEach(function (preset) {
        var p = mk('button', 'mini', preset);
        p.addEventListener('click', function () { box.querySelector('input').value = preset; askAbout(x, box); });
        qrow.appendChild(p);
      });
      var gin = mk('input'); gin.placeholder = '或自己问：如 fully 为什么不能修饰名词？';
      gin.maxLength = 120;
      var go = mk('button', 'primary mini ask-go', '提问');
      go.addEventListener('click', function () { askAbout(x, box); });
      gin.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') askAbout(x, box); });
      box.appendChild(qrow); box.appendChild(gin); box.appendChild(go);
      qbtn.addEventListener('click', function () {
        box.style.display = box.style.display === 'none' ? 'block' : 'none';
        if (box.style.display === 'block') gin.focus();
      });
      var foot = mk('div'); foot.appendChild(qbtn); foot.appendChild(box);
      item.appendChild(foot);
      errs.appendChild(item);
    });
    var hl = el('fb-highlights');
    hl.innerHTML = '';
    (d.highlight || []).forEach(function (h) {
      var line = mk('div', 'hl');
      line.appendChild(document.createTextNode('🌟 ' + h.en));
      if (h.zh) line.appendChild(mk('div', 'w', h.zh));
      hl.appendChild(line);
    });
    var c = el('fb-comment');
    c.classList.toggle('hidden', !d.comment);
    c.textContent = d.comment || '';
    var rw = el('fb-rewrite-box');
    rw.hidden = !d.rewrite;
    el('fb-rewrite').textContent = d.rewrite || '';
    el('fb-title').textContent = '批改结果 · ' + (d.wordCount || 0) + ' 词';
    logPush(d);
    el('fb-card').classList.remove('hidden');
  }
  function feedbackText() {
    var d = state.feedback;
    if (!d) return '';
    var out = ['# 批改：' + (state.topic ? state.topic.en : '')];
    if ((d.errors || []).length) {
      out.push('', '## 错误');
      d.errors.forEach(function (x, i) {
        out.push((i + 1) + '. ' + x.quote + ' → ' + x.fix + (x.kind ? '（' + x.kind + '）' : ''));
        if (x.why) out.push('   ' + x.why);
      });
    }
    (d.highlight || []).forEach(function (h) { out.push('🌟 ' + h.en + (h.zh ? ' — ' + h.zh : '')); });
    if (d.comment) out.push('', '点评：' + d.comment);
    if (d.rewrite) out.push('', '## 润色后的全文', d.rewrite);
    return out.join('\n');
  }
  async function correct() {
    var text = el('essay').value.trim();
    if (!state.topic) { setStatus('先等主题出来'); return; }
    if (wordCount(text) < 25) {
      setStatus('至少写个两三句（约 25 词）才好批改——先随便写，别怕错。', true);
      return;
    }
    setStatus('正在逐句看你的文章：先挑硬伤，再过一遍「语法对但 native 不这样说」的别扭句（长文约 30~60 秒）…');
    state.lastAction = correct;
    try {
      var d = await callApi({ mode: 'correct', topic: state.topic.en, topicZh: state.topic.zh, text: text });
      renderFeedback(d);
      setStatus('');
      state.lastAction = null;
    } catch (e) {
      setStatus(e.message, true);
    }
  }

  /* ---------- 对某条修改意见的追问 ---------- */
  function askRead() {
    try { var a = JSON.parse(localStorage.getItem(LSA) || '{}'); return a && typeof a === 'object' ? a : {}; } catch (e) { return {}; }
  }
  function askKey(q, e, question) {
    return [q, e.quote, e.fix, question].join('|').toLowerCase().replace(/\s+/g, ' ');
  }
  function askSave(key, d) {
    var map = askRead(); map[key] = d;
    var ks = Object.keys(map);
    while (ks.length > 60) { delete map[ks.shift()]; }   // FIFO 60 条
    try { localStorage.setItem(LSA, JSON.stringify(map)); } catch (e) { /* 存不下就算了 */ }
  }
  function renderAsk(box, d) {
    var old = box.querySelector('.ask-a'); if (old) old.remove();
    var wrap = mk('div', 'ask-a');
    if (d.verdict === 'revised') {
      wrap.appendChild(mk('span', 'ask-adj', '教练认账：这条调整了'));
      if (d.revisedFix) wrap.appendChild(mk('div', null, '调整后的意见：' + d.revisedFix));
    }
    wrap.appendChild(mk('div', null, d.answer));
    (d.examples || []).forEach(function (x) {
      wrap.appendChild(mk('div', 'eg', x.en + (x.zh ? ' ｜ ' + x.zh : '')));
    });
    box.appendChild(wrap);
  }
  function askAbout(err, box) {
    var text = String(box.querySelector('input').value || '').trim();
    if (text.length < 4) { box.querySelector('input').focus(); return; }
    var key = askKey(state.topic && state.topic.en, err, text);
    var hit = askRead()[key];
    if (hit) { renderAsk(box, hit); return; }
    if (state.askBusy) return;
    state.askBusy = true;
    var btn = box.querySelector('.ask-go');
    btn.disabled = true; btn.textContent = '想一下（5~15 秒）…';
    callApi({
      mode: 'ask', topic: state.topic && state.topic.en, quote: err.quote, fix: err.fix,
      why: err.why, kind: err.kind, question: text, essay: String(el('essay').value || '').slice(0, 1500),
    }).then(function (d) {
      askSave(key, d);
      renderAsk(box, d);
    }).catch(function (e) {
      var old = box.querySelector('.ask-a'); if (old) old.remove();
      box.appendChild(mk('div', 'ask-a', '没答上：' + e.message));
    }).then(function () {
      state.askBusy = false; btn.disabled = false; btn.textContent = '提问';
    });
  }

  /* ---------- 批改台账（本机）与学习画像 ---------- */
  function logRead() {
    try { var a = JSON.parse(localStorage.getItem(LSL) || '[]'); return Array.isArray(a) ? a : []; } catch (e) { return []; }
  }
  function logPush(d) {
    var list = logRead();
    var kinds = {};
    (d.errors || []).forEach(function (x) { var k = x.kind || '其他'; kinds[k] = (kinds[k] || 0) + 1; });
    list.push({
      at: Date.now(),
      topic: (state.topic && state.topic.en) || '',
      wordCount: d.wordCount || 0,
      kinds: kinds,
      quotes: (d.errors || []).slice(0, 12).map(function (x) { return String(x.quote || '').slice(0, 60); }),
      text: String(el('essay').value || '').slice(0, 400),
    });
    while (list.length > 30) list.shift();   // 留最近 30 篇，太久远的规律早变了
    try { localStorage.setItem(LSL, JSON.stringify(list)); } catch (e) { /* 存不下算了 */ }
  }

  // 只统计不花钱的部分：句长、从句率、错误类型累计，都在本机算好再交给模型看规律
  function analyze(list) {
    var kindTotals = {}, quotes = {}, sents = [], tenseErrs = 0;
    list.forEach(function (e) {
      Object.keys(e.kinds || {}).forEach(function (k) {
        kindTotals[k] = (kindTotals[k] || 0) + e.kinds[k];
        if (/时态/.test(k)) tenseErrs += e.kinds[k];
      });
      (e.quotes || []).forEach(function (q) { if (q) quotes[q] = (quotes[q] || 0) + 1; });
      String(e.text || '').split(/(?<=[.!?])\s+/).forEach(function (x) { if (x.trim()) sents.push(x.trim()); });
    });
    var SUB = /\b(because|which|who|whom|whose|although|though|unless|while|after|before|since|when|where|that|so that|if)\b/i;
    var NONFIN = /(^|,)\s*(-ing|\w*ing)|\bto\s+\w+/i; // 粗算：句首/逗号后 -ing 或 to do
    var complex = 0, words = 0;
    sents.forEach(function (x) {
      words += x.split(/\s+/).length;
      if (SUB.test(x) || NONFIN.test(x)) complex++;
    });
    var top = Object.keys(quotes).sort(function (a, b) { return quotes[b] - quotes[a]; }).slice(0, 8);
    var times = list.map(function (e) { return e.at; }).sort(function (a, b) { return a - b; });
    var dayMs = 86400000;
    return {
      n: list.length,
      span: times.length > 1 ? Math.max(1, Math.round((times[times.length - 1] - times[0]) / dayMs)) + ' 天内 ' + list.length + ' 篇' : '刚开始攒',
      kindTotals: kindTotals,
      tenseErrs: tenseErrs,
      avgSentenceWords: sents.length ? +(words / sents.length).toFixed(1) : 0,
      simpleRate: sents.length ? +(1 - complex / sents.length).toFixed(2) : 0,
      connectiveRate: sents.length ? +(complex / sents.length).toFixed(2) : 0,
      sentenceCount: sents.length,
      topQuotes: top,
      samples: list.slice(-6).map(function (e) { return e.text; }).filter(Boolean),
    };
  }

  function renderProfile(d) {
    state.profile = d;
    try { localStorage.setItem(LSP, JSON.stringify(d)); } catch (e) { /* ok */ }
    var body = el('pro-body');
    body.innerHTML = '';
    if (d.portrait) body.appendChild(mk('p', 'count', d.portrait));
    (d.weaknesses || []).forEach(function (w) {
      var box = mk('div', 'wk');
      box.appendChild(mk('b', null, '🎯 ' + w.name));
      if (w.evidence) box.appendChild(mk('div', 'ev', '证据：' + w.evidence));
      if (w.how) box.appendChild(mk('div', 'how', '怎么补：' + w.how));
      body.appendChild(box);
    });
    (d.lessons || []).forEach(function (l, i) {
      var st = mk('div', 'step');
      st.appendChild(mk('span', 'tag', l.stage || ('第 ' + (i + 1) + ' 步')));
      st.appendChild(mk('h3', null, l.title));
      if (l.teach) st.appendChild(mk('div', null, l.teach));
      (l.examples || []).forEach(function (x) {
        var line = mk('div', 'ex');
        if (x.wrong) line.appendChild(mk('span', 'no', x.wrong));
        line.appendChild(document.createTextNode((x.wrong ? '→ ' : '') + x.right));
        st.appendChild(line);
      });
      if (l.drill) st.appendChild(mk('div', 'drill', '✏️ 练一句：' + l.drill));
      body.appendChild(st);
    });
    if (d.nextFocus) body.appendChild(mk('div', 'focus', '下次只练这一件：' + d.nextFocus));
    var hint = mk('p', 'count', '只把你本机的句长/从句率/错误分布和最近 6 篇的节选发给了模型；全文没离开这台设备。');
    hint.style.marginTop = '8px';
    body.appendChild(hint);
    el('pro-card').classList.remove('hidden');
  }
  function profileText() {
    var d = state.profile;
    if (!d) return '';
    var out = ['# 学习画像', d.portrait || '', '', '## 薄弱环节'];
    (d.weaknesses || []).forEach(function (w, i) {
      out.push((i + 1) + '. ' + w.name);
      if (w.evidence) out.push('   证据：' + w.evidence);
      if (w.how) out.push('   怎么补：' + w.how);
    });
    out.push('', '## 循序渐进微练习');
    (d.lessons || []).forEach(function (l, i) {
      out.push((l.stage || '第 ' + (i + 1) + ' 步') + '：' + l.title);
      if (l.teach) out.push('   ' + l.teach);
      (l.examples || []).forEach(function (x) { out.push('   ' + (x.wrong ? x.wrong + ' → ' : '') + x.right); });
      if (l.drill) out.push('   练一句：' + l.drill);
    });
    if (d.nextFocus) out.push('', '下次只练这一件：' + d.nextFocus);
    return out.join('\n');
  }
  async function askProfile() {
    setStatus('');
    state.lastAction = askProfile;
    var list = logRead();
    if (list.length < 3) {
      setStatus('台账里只有 ' + list.length + ' 篇，写满 3 篇批改才有把握诊断规律——样本太少模型也只能瞎猜。', true);
      return;
    }
    setStatus('正在翻你攒的 ' + list.length + ' 篇批改记录，找跨篇规律（约 15~30 秒）…');
    try {
      var d = await callApi({ mode: 'profile', stats: analyze(list) });
      renderProfile(d);
      setStatus('');
      state.lastAction = null;
    } catch (e) {
      setStatus(e.message, true);
    }
  }

  /* ---------- 复制 ---------- */
  async function copyText(text, btn) {
    if (!text) return;
    var done = function () {
      var old = btn.textContent;
      btn.textContent = '已复制 ✓';
      setTimeout(function () { btn.textContent = old; }, 1500);
    };
    try { await navigator.clipboard.writeText(text); done(); }
    catch (e) {
      var ta = mk('textarea');
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch (e2) { setStatus('浏览器不让复制，长按手动选吧', true); }
      document.body.removeChild(ta);
    }
  }

  /* ---------- 启动 ---------- */
  async function boot() {
    var saved = loadDraft();
    if (saved && saved.topic) renderTopic(saved.topic);
    if (saved && saved.text) { el('essay').value = saved.text; updateCount(); }
    try {
      var res = await fetch(API + '/health');
      var h = await res.json();
      if (!h.ok) throw new Error('');
    } catch (e) {
      el('t-status').className = 'status err';
      el('t-status').textContent = '连不上写作服务（站点进程可能刚更新），刷新前稍等十几秒';
    }
    if (!state.topic) newTopic();
    el('dice').addEventListener('click', newTopic);
    el('tips-btn').addEventListener('click', getTips);
    el('fix-btn').addEventListener('click', correct);
    el('fb-copy').addEventListener('click', function (ev) { copyText(feedbackText(), ev.currentTarget); });
    el('pro-btn').addEventListener('click', askProfile);
    el('pro-copy').addEventListener('click', function (ev) { copyText(profileText(), ev.currentTarget); });
    el('pro-clear').addEventListener('click', function () {
      if (confirm('清空批改台账？学习画像要重新攒记录才生成（草稿和主题不受影响）')) {
        try { localStorage.removeItem(LSL); localStorage.removeItem(LSP); } catch (e) { /* ok */ }
        el('pro-card').classList.add('hidden');
        setStatus('台账已清空，写完三篇再来诊断。');
      }
    });
    try { var lastPro = JSON.parse(localStorage.getItem(LSP) || 'null'); if (lastPro && lastPro.kind === 'profile') renderProfile(lastPro); } catch (e) { /* 坏档就算了 */ }
    el('fb-copyrw').addEventListener('click', function (ev) { copyText((state.feedback && state.feedback.rewrite) || '', ev.currentTarget); });
    var t0 = 0;
    el('essay').addEventListener('input', function () {
      updateCount();
      clearTimeout(t0);
      t0 = setTimeout(saveDraft, 400);
    });
    window.addEventListener('beforeunload', saveDraft);
  }
  boot();

  if (typeof window !== 'undefined') {
    window.enWriting = {
      state: state, callApi: callApi, renderTopic: renderTopic, newTopic: newTopic,
      logRead: logRead, logPush: logPush, analyze: analyze, askProfile: askProfile, renderProfile: renderProfile, profileText: profileText,
      renderTips: renderTips, getTips: getTips, renderFeedback: renderFeedback,
      renderAsk: renderAsk, askRead: askRead, correct: correct,
      feedbackText: feedbackText, wordCount: wordCount, saveDraft: saveDraft, loadDraft: loadDraft,
    };
  }
})();
</script>
