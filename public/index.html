<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>xixi的许愿池</title>
  <link rel="icon" href="/icon.png" type="image/png">
  <style>
    :root {
      color-scheme: light;
      --ink: #25211d;
      --paper: #f6f1e8;
      --accent: #d84f2b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 20% 20%, rgba(245, 197, 66, 0.35), transparent 30%),
        radial-gradient(circle at 80% 15%, rgba(216, 79, 43, 0.18), transparent 28%),
        var(--paper);
      color: var(--ink);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
    }

    main {
      width: min(760px, calc(100% - 32px));
      padding: clamp(24px, 5vw, 56px);
      border: 3px solid var(--ink);
      border-radius: 34px;
      background: rgba(255, 252, 245, 0.86);
      box-shadow: 12px 14px 0 rgba(37, 33, 29, 0.16);
      text-align: center;
    }

    .icon-wrap {
      display: inline-flex;
      padding: 14px;
      border: 3px solid var(--ink);
      border-radius: 28px;
      background: #fffaf0;
      box-shadow: 6px 7px 0 rgba(37, 33, 29, 0.12);
    }

    img {
      display: block;
      width: min(360px, 72vw);
      height: auto;
      border-radius: 18px;
    }

    h1 {
      margin: 28px 0 0;
      font-size: clamp(2.5rem, 8vw, 5.5rem);
      line-height: 1.05;
      letter-spacing: 0;
    }

    .rule {
      width: 120px;
      height: 8px;
      margin: 22px auto 0;
      border-radius: 999px;
      background: linear-gradient(90deg, var(--accent), #f5c542, #2f8f5b);
    }

    footer {
      margin-top: 18px;
      color: rgba(37, 33, 29, 0.62);
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <main>
    <div class="icon-wrap">
      <img src="/icon.png" alt="xixi 图标">
    </div>
    <h1>xixi的许愿池</h1>
    <div class="rule" aria-hidden="true"></div>
    <footer>port 10801</footer>
  </main>
</body>
</html>
